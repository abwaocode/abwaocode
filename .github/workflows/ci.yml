name: CI

on:
  push:
    branches: [maini]
  pull_request:
    branches: [maini]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate profile README
        run: |
          test -f README.md
          test -s README.md
